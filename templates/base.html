<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ReelFlow{% endblock %}</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block extra_css %}{% endblock %}

    <script>
        function getSystemTheme() {
            return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        function applyTheme(theme) {
            if (theme === 'system') {
                document.documentElement.setAttribute('data-theme', getSystemTheme());
            } else {
                document.documentElement.setAttribute('data-theme', theme);
            }
        }
        function setTheme(theme) {
            localStorage.setItem('theme', theme);
            applyTheme(theme);
        }
        const savedTheme = localStorage.getItem('theme') || 'system';
        applyTheme(savedTheme);

        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
            if (localStorage.getItem('theme') === 'system' || !localStorage.getItem('theme')) {
                applyTheme('system');
            }
        });
    </script>
</head>
<body>
    <nav class="navbar navbar-expand-lg premium-nav">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fa-solid fa-wand-magic-sparkles"></i> ReelFlow
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <i class="fa-solid fa-bars" style="color: white;"></i>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/"><i class="fa-solid fa-house"></i> Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link cta-nav" href="/create"><i class="fa-solid fa-plus"></i> Create Reel</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/gallery"><i class="fa-solid fa-clapperboard"></i> Gallery</a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="themeDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="fa-solid fa-circle-half-stroke"></i> Theme
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="themeDropdown">
                            <li><a class="dropdown-item" href="#" onclick="setTheme('light')"><i class="fa-solid fa-sun"></i> Light</a></li>
                            <li><a class="dropdown-item" href="#" onclick="setTheme('dark')"><i class="fa-solid fa-moon"></i> Dark</a></li>
                            <li><a class="dropdown-item" href="#" onclick="setTheme('system')"><i class="fa-solid fa-desktop"></i> System Default</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="main-content">
        {% block content %}{% endblock %}
    </div>

    <footer class="premium-footer">
        <div class="container">
            <div class="footer-content">
                <div class="copyright">
                    © 2026 ReelFlow. Powered by AI.
                </div>
                <div class="social-links">
                    <a href="https://www.instagram.com/?form=MT00VA" target="_blank"><i class="fab fa-instagram"></i></a>
                    <a href="https://x.com/home?form=MT00VL" target="_blank"><i class="fa-brands fa-x-twitter"></i></a>
                    <a href="https://www.linkedin.com/in/tanush-bhatt-6a553932a" target="_blank"><i class="fab fa-linkedin"></i></a>
                    <a href="https://github.com/tanu5h" target="_blank"><i class="fab fa-github"></i></a>
                </div>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
